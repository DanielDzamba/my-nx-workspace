# Redis cache of java-api, in the cluster. Render's Key Value store is reachable only from inside
# Render, and a managed Redis (Memorystore) would cost about 30 € a month. A cache may be lost at
# any time (it fills up again from the database), so one pod without a volume is enough.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          # Stay below the memory limit and drop the least recently used keys when full, instead
          # of being OOM-killed (the same policy as on Render)
          args: ['--maxmemory', '48mb', '--maxmemory-policy', 'allkeys-lru']
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
