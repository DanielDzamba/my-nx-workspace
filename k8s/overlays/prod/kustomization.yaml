# Production overlay (GKE): base + Google's Gateway with HTTPS + Redis in the cluster.
# PostgreSQL (Neon) and RabbitMQ (CloudAMQP) stay outside the cluster; their credentials come
# from Google Secret Manager through the External Secrets Operator (external-secrets.yaml).
# Deployed by .github/workflows/deploy-gke.yml on every push to main (see README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todo
resources:
  - namespace.yaml
  - ../../base
  - gateway.yaml
  - health-checks.yaml
  - redis.yaml
  - external-secrets.yaml
  - pod-monitoring.yaml

# Images in Artifact Registry. The tag is the commit SHA of the build; tools/scripts/k8s-prod.mjs
# replaces `deploy-time` with it when rendering, so this file never needs a commit per release.
images:
  - name: java-api
    newName: europe-west3-docker.pkg.dev/todo-gke-514711/todo/java-api
    newTag: deploy-time
  - name: notification-service
    newName: europe-west3-docker.pkg.dev/todo-gke-514711/todo/notification-service
    newTag: deploy-time

# Not secret. Hash suffix in the name: a changed value rolls the pods (as in overlays/local).
# MANAGEMENT_*: /actuator/prometheus for pod-monitoring.yaml, and request latency counted in a few
# fixed buckets (le=...), so PromQL can compute percentiles without hundreds of histogram series.
configMapGenerator:
  - name: java-api-config
    literals:
      - SPRING_DATA_REDIS_URL=redis://redis:6379
      - APP_CORS_ALLOWED_ORIGINS=https://danieldzamba.github.io
      - SPRINGDOC_SWAGGER_UI_ENABLED=false
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus
      - MANAGEMENT_METRICS_DISTRIBUTION_SLO_HTTP_SERVER_REQUESTS=50ms,100ms,250ms,500ms,1s,2s,5s
  - name: notification-service-config
    literals:
      - APP_CORS_ALLOWED_ORIGINS=https://danieldzamba.github.io
      - SPRINGDOC_SWAGGER_UI_ENABLED=false
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus
      - MANAGEMENT_METRICS_DISTRIBUTION_SLO_HTTP_SERVER_REQUESTS=50ms,100ms,250ms,500ms,1s,2s,5s
