# Production overlay (GKE): base + Google's Gateway with HTTPS + Redis in the cluster.
# PostgreSQL (Neon) and RabbitMQ (CloudAMQP) stay outside the cluster; their addresses and
# credentials come from local, git-ignored files (*.secrets.env, see README.md next to this file).
# Deploy with `npx nx run k8s:prod-images` + `npx nx run k8s:prod-deploy`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todo
resources:
  - namespace.yaml
  - ../../base
  - gateway.yaml
  - health-checks.yaml
  - redis.yaml

# Images in Artifact Registry, tagged with the git commit they were built from. The tags are
# written here by `k8s:prod-images`, so Git records which version runs in production.
images:
  - name: java-api
    newName: europe-west3-docker.pkg.dev/todo-gke-514711/todo/java-api
    newTag: fbc4eeb99a3f
  - name: notification-service
    newName: europe-west3-docker.pkg.dev/todo-gke-514711/todo/notification-service
    newTag: fbc4eeb99a3f

# Not secret. Hash suffix in the name: a changed value rolls the pods (as in overlays/local).
configMapGenerator:
  - name: java-api-config
    literals:
      - SPRING_DATA_REDIS_URL=redis://redis:6379
      - APP_CORS_ALLOWED_ORIGINS=https://danieldzamba.github.io
      - SPRINGDOC_SWAGGER_UI_ENABLED=false
  - name: notification-service-config
    literals:
      - APP_CORS_ALLOWED_ORIGINS=https://danieldzamba.github.io
      - SPRINGDOC_SWAGGER_UI_ENABLED=false

# Neon and CloudAMQP URLs and passwords. The files exist only on the machine that deploys
# (git-ignored); *.secrets.env.example shows the keys.
secretGenerator:
  - name: java-api-secrets
    envs:
      - java-api.secrets.env
  - name: notification-service-secrets
    envs:
      - notification-service.secrets.env
