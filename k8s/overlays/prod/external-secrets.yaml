# Production credentials come from Google Secret Manager (infra/terraform/gke/secrets.tf). The
# External Secrets Operator (installed by Terraform) reads them with its own identity (GKE Workload
# Identity, no key) and writes them into the Kubernetes Secrets the Deployments already use
# (envFrom: java-api-secrets / notification-service-secrets in base). Neither Git nor CI ever
# sees the values.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: todo-gke-514711
      # No auth block: the operator uses the Google identity of its own pod (Workload Identity),
      # which is allowed to read exactly the two secrets below.
---
# Each Secret Manager secret holds a JSON object; every key becomes one entry of the Kubernetes
# Secret, i.e. one environment variable (SPRING_DATASOURCE_URL, ...).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: java-api-secrets
spec:
  # Changed values reach the Secret within this time. Running pods keep their environment until
  # they restart (kubectl rollout restart deployment/java-api).
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: java-api-secrets
  dataFrom:
    - extract:
        key: java-api-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: notification-service-secrets
  dataFrom:
    - extract:
        key: notification-service-secrets
