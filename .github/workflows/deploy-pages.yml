name: Deploy angular-demo to GitHub Pages

# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Only the static frontend is deployed here; java-api and PostgreSQL are hosted elsewhere.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - run: npx nx build angular-demo --configuration=github-pages

      # SPA fallback: Pages serves 404.html for unknown paths, so deep links still load the app
      - run: cp dist/apps/angular-demo/browser/index.html dist/apps/angular-demo/browser/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/apps/angular-demo/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
