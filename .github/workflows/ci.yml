name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

# A new push to the same PR cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job name `main` is the required status check in the main branch ruleset; rename both together.
  # Frontend steps mirror tools/scripts/ci-checks.mjs --full; keep them in sync.
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      # JDK for apps/java-api (Maven wrapper handles Maven itself)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # `cache: maven` above keeps only ~/.m2/repository (the libraries). The Maven distribution
      # that mvnw downloads (~/.m2/wrapper) would otherwise come from Maven Central on every run,
      # and one failed download fails the build. The key changes with the Maven version.
      - name: Cache Maven wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('apps/*/.mvn/wrapper/maven-wrapper.properties') }}

      # Sets NX_BASE / NX_HEAD so `nx affected` only runs projects the PR touches
      - uses: nrwl/nx-set-shas@v4

      # A contract change must not break existing clients (removed endpoint or field, new required
      # parameter, changed type, ...). Compares api-contract/openapi.yaml with the PR's base branch;
      # skipped while the base branch has no contract yet.
      - name: Get API contract of the base branch
        id: base-contract
        if: github.event_name == 'pull_request'
        run: |
          # tmp/ is git-ignored, so the copy does not end up in format:check or the Nx project graph
          mkdir -p tmp
          if git show "origin/${{ github.base_ref }}:api-contract/openapi.yaml" > tmp/base-openapi.yaml 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check API contract for breaking changes
        if: steps.base-contract.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.18
        with:
          base: tmp/base-openapi.yaml
          revision: api-contract/openapi.yaml
          fail-on: ERR
          # Breaking changes accepted on purpose (each one is a reviewed line in this file)
          err-ignore: api-contract/oasdiff-err-ignore.txt
          # Keep the specs in CI: no upload to oasdiff.com, no PR comment
          review: 'false'
          github-token: ''

      # Same check for the contract of notification-service
      - name: Get notification API contract of the base branch
        id: base-notification-contract
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p tmp
          if git show "origin/${{ github.base_ref }}:api-contract/notification-service/openapi.yaml" > tmp/base-notification-openapi.yaml 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check notification API contract for breaking changes
        if: steps.base-notification-contract.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.18
        with:
          base: tmp/base-notification-openapi.yaml
          revision: api-contract/notification-service/openapi.yaml
          fail-on: ERR
          review: 'false'
          github-token: ''

      - run: npx nx format:check

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: npx nx-cloud record -- echo Hello World
      # test enforces the coverage thresholds from each project's vite.config.mts
      - run: npx nx affected -t lint typecheck test build

      # E2E runs against a mocked API (see apps/angular-demo/e2e), so no backend or database is needed
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npx nx affected -t e2e -- --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: dist/.playwright
          if-no-files-found: ignore

      # Report-only: known vulnerabilities in dependencies do not block the merge
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
