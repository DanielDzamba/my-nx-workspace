# Render Blueprint (https://render.com/docs/blueprint-spec) for java-api.
# The frontend is on GitHub Pages (.github/workflows/deploy-pages.yml), the database on Neon.
# Paths are relative to the repo root; rootDir only limits which changes trigger a deploy.
services:
  - type: web
    # Also the subdomain: https://danieldzamba-java-api.onrender.com (apiUrl in environment.ts)
    name: danieldzamba-java-api
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS eu-central-1)
    region: frankfurt
    rootDir: apps/java-api
    dockerfilePath: ./apps/java-api/Dockerfile
    dockerContext: ./apps/java-api
    # Readiness does not include the database, so a sleeping Neon compute does not fail the deploy
    healthCheckPath: /actuator/health/readiness
    # Deploy a commit on main only after CI has passed on it
    autoDeployTrigger: checksPass
    envVars:
      # Neon connection, entered in the Render dashboard (never committed):
      # jdbc:postgresql://<host>.neon.tech/<database>?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://danieldzamba.github.io
      # Free plan has 512 MB RAM and a fraction of a CPU: leave room for metaspace and threads,
      # use the single-threaded GC and trade peak performance for a faster startup
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50 -XX:+UseSerialGC -XX:TieredStopAtLevel=1
