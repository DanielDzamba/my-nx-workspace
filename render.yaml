# Render Blueprint (https://render.com/docs/blueprint-spec) for java-api.
# The frontend is on GitHub Pages (.github/workflows/deploy-pages.yml), the database on Neon,
# RabbitMQ on CloudAMQP; the Redis cache is the Key Value service below.
# Paths are relative to the repository root.
services:
  - type: web
    # Also the subdomain: https://danieldzamba-java-api.onrender.com (apiUrl in environment.ts)
    name: danieldzamba-java-api
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS eu-central-1)
    region: frankfurt
    # Repository root as build context: the build also needs the API contract (api-contract/)
    dockerfilePath: ./apps/java-api/Dockerfile
    dockerContext: .
    # Deploy only when the API or its contract changed (rootDir would hide api-contract/)
    buildFilter:
      paths:
        - apps/java-api/**
        - api-contract/**
    # Readiness does not include the database, so a sleeping Neon compute does not fail the deploy
    healthCheckPath: /actuator/health/readiness
    # Deploy a commit on main only after CI has passed on it
    autoDeployTrigger: checksPass
    envVars:
      # Neon connection, entered in the Render dashboard (never committed):
      # jdbc:postgresql://<host>.neon.tech/<database>?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # RabbitMQ on CloudAMQP (free plan), entered in the Render dashboard (never committed):
      # amqps://<user>:<password>@<host>/<vhost> - amqps turns on TLS
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false
      # Internal URL of the Key Value service below (redis://red-...:6379), filled in by Render
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: danieldzamba-java-api-cache
          property: connectionString
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://danieldzamba.github.io
      # Swagger UI is for development; the contract itself stays readable at /openapi.yaml
      - key: SPRINGDOC_SWAGGER_UI_ENABLED
        value: 'false'
      # Free plan has 512 MB RAM and a fraction of a CPU: leave room for metaspace and threads,
      # use the single-threaded GC and trade peak performance for a faster startup
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50 -XX:+UseSerialGC -XX:TieredStopAtLevel=1

  # Redis-compatible cache (users, see docs/java-api/caching.md). Free plan: 25 MB, no persistence,
  # which is fine for a cache: it fills up again from the database after a restart.
  - type: keyvalue
    name: danieldzamba-java-api-cache
    plan: free
    region: frankfurt
    # No access from the internet: only services in this Render account reach it
    ipAllowList: []
    # When memory is full, drop the least recently used keys instead of rejecting writes
    maxmemoryPolicy: allkeys-lru
