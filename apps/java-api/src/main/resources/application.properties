spring.application.name=java-api
# PaaS hosts usually inject PORT
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# PostgreSQL - the datasource is intentionally not configured here:
# - local run: spring-boot-docker-compose starts compose.yaml and wires the connection
# - tests: Testcontainers (@ServiceConnection)
# - deployed: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
# No Hibernate session outside @Transactional service methods: lazy relations must be loaded
# in the service, and a DB connection is not held for the whole request (incl. JSON rendering)
spring.jpa.open-in-view=false

# Optional response fields without a value are left out, as the contract says ("missing while
# unknown"), instead of being sent as null
spring.jackson.default-property-inclusion=non_null

# Error bodies are RFC 9457 Problem Details (application/problem+json), as api-contract declares
spring.mvc.problemdetails.enabled=true

# Swagger UI (/swagger-ui.html) shows the contract itself, served from the classpath as
# /openapi.yaml (see pom.xml), not a spec generated from the code: the contract is the source of truth.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.url=/openapi.yaml
server.mime-mappings.yaml=application/yaml

# Upper limit for ?size= on paged endpoints, so a client cannot ask for the whole table at once
spring.data.web.pageable.max-page-size=100

# Keep the database container running between app restarts (stop it with `docker compose down`)
spring.docker.compose.lifecycle-management=start-only

# RabbitMQ - like the datasource, the connection is not configured here: compose.yaml locally,
# Testcontainers in tests, SPRING_RABBITMQ_ADDRESSES (amqps://user:password@host/vhost) when deployed.
# The broker confirms every message the outbox relay sends, so an event is marked as published
# only once RabbitMQ has stored it.
spring.rabbitmq.publisher-confirm-type=simple
# A failing listener is retried 3 times (1 s, 2 s, 4 s apart), then rejected without requeue, so
# RabbitMQ moves the message to the dead-letter queue instead of redelivering it forever
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Redis - the cache behind @Cacheable (CacheConfig, docs/java-api/caching.md). Like the datasource,
# the connection is not configured here: compose.yaml locally, Testcontainers in tests,
# SPRING_DATA_REDIS_URL (redis://host:port) when deployed.
spring.cache.type=redis
# Upper bound for how long an entry can be outdated when an eviction was missed (e.g. Redis was down)
spring.cache.redis.time-to-live=5m
# Keys look like java-api:users::auth0|64f1..., so other apps can share the Redis instance
spring.cache.redis.key-prefix=java-api:
spring.cache.redis.cache-null-values=false
# When Redis hangs, a request gives up on the cache quickly and reads the database (the default
# command timeout is 60 s)
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=1s

# Transactional outbox (OutboxRelay): how often unpublished events are sent, and how long and when
# published ones are kept and deleted
app.outbox.relay-interval=1s
app.outbox.retention=7d
app.outbox.cleanup-cron=0 0 3 * * *

# Comma-separated; deployed frontend origin is set via APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=http://localhost:4200

# Auth0 access tokens (see SecurityConfig). Not secrets: the signing keys are fetched from
# <issuer>.well-known/jwks.json. The trailing slash is part of Auth0's issuer (`iss` claim).
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://todo-app-todos.eu.auth0.com/
# API Identifier in Auth0; tokens issued for another API are rejected
spring.security.oauth2.resourceserver.jwt.audiences=https://todo-api
