spring.application.name=java-api
# PaaS hosts usually inject PORT
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# PostgreSQL - the datasource is intentionally not configured here:
# - local run: spring-boot-docker-compose starts compose.yaml and wires the connection
# - tests: Testcontainers (@ServiceConnection)
# - deployed: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Keep the database container running between app restarts (stop it with `docker compose down`)
spring.docker.compose.lifecycle-management=start-only

# Comma-separated; deployed frontend origin is set via APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=http://localhost:4200
