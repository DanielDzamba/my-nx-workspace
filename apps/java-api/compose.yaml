# Local development infrastructure for java-api and notification-service.
#
# `npx nx serve java-api` starts it automatically (spring-boot-docker-compose), and
# `npx nx serve notification-service` starts notification-postgres and rabbitmq, so you rarely need
# to run this by hand. Useful commands, from apps/java-api:
#   docker compose up -d --wait          # start PostgreSQL, RabbitMQ and Redis
#   docker compose --profile full up --build   # PostgreSQL + the API as a container
#   docker compose down                  # stop (data is kept in the volume)
#   docker compose down -v               # stop and wipe the database
name: java-api

services:
  postgres:
    image: postgres:17-alpine
    environment:
      # Development-only credentials
      POSTGRES_DB: java_api
      POSTGRES_USER: java_api
      POSTGRES_PASSWORD: java_api
    ports:
      # Bound to localhost only, so the database is not reachable from the network
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Database of notification-service: its own container, as each service owns its database.
  # Port 5433, so it does not clash with java-api's on 5432.
  notification-postgres:
    image: postgres:17-alpine
    labels:
      # Not a connection for java-api: spring-boot-docker-compose would otherwise see two databases
      org.springframework.boot.ignore: 'true'
    environment:
      # Development-only credentials (application-local.properties of notification-service)
      POSTGRES_DB: notification_service
      POSTGRES_USER: notification_service
      POSTGRES_PASSWORD: notification_service
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Message broker for the TodoCompleted and UserBlocked/UserUnblocked events.
  # Management UI: http://localhost:15672
  # (login java_api / java_api): exchanges, queues, the dead-letter queue and message rates.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      # Development-only credentials
      RABBITMQ_DEFAULT_USER: java_api
      RABBITMQ_DEFAULT_PASS: java_api
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # Cache (users). Look inside: docker compose exec redis redis-cli KEYS 'java-api:*'
  # No volume: a cache may be lost at any time, it fills up again from the database.
  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: [full]
    # Repository root as context: the build needs api-contract/ (see Dockerfile)
    build:
      context: ../..
      dockerfile: apps/java-api/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/java_api
      SPRING_DATASOURCE_USERNAME: java_api
      SPRING_DATASOURCE_PASSWORD: java_api
      SPRING_RABBITMQ_ADDRESSES: amqp://java_api:java_api@rabbitmq:5672
      SPRING_DATA_REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  notification-postgres-data:
  rabbitmq-data:
