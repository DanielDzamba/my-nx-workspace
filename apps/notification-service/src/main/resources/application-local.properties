# Profile `local` (`npx nx serve notification-service`): the infrastructure from
# apps/java-api/compose.yaml, which the serve target starts first. Development-only credentials.
#
# Own PostgreSQL container `notification-postgres` on port 5433: this service never shares a
# database with java-api, not even locally.
spring.datasource.url=jdbc:postgresql://localhost:5433/notification_service
spring.datasource.username=notification_service
spring.datasource.password=notification_service

# The same broker as java-api
spring.rabbitmq.addresses=amqp://java_api:java_api@localhost:5672
