spring.application.name=notification-service
# PaaS hosts usually inject PORT; 8081 next to java-api (8080) locally
server.port=${PORT:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# PostgreSQL - this service's own database (database per service: java-api cannot read it, and
# it never reads java-api's). Not configured here:
# - local run: application-local.properties (profile `local`, set by `nx serve notification-service`)
# - tests: Testcontainers (@ServiceConnection)
# - deployed: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
# No Hibernate session outside @Transactional service methods
spring.jpa.open-in-view=false

spring.jackson.default-property-inclusion=non_null

# Error bodies are RFC 9457 Problem Details (application/problem+json), as the contract declares
spring.mvc.problemdetails.enabled=true

# Swagger UI (/swagger-ui.html) shows the contract itself, served from the classpath as
# /openapi.yaml (see pom.xml), not a spec generated from the code: the contract is the source of truth.
# Off in production (SPRINGDOC_SWAGGER_UI_ENABLED=false in render.yaml), like in java-api.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.url=/openapi.yaml
server.mime-mappings.yaml=application/yaml

# RabbitMQ - the broker java-api publishes to. Not configured here: application-local.properties
# locally, Testcontainers in tests, SPRING_RABBITMQ_ADDRESSES (amqps://user:password@host/vhost)
# when deployed.
# A failing listener is retried 3 times (1 s, 2 s, 4 s apart), then rejected without requeue, so
# RabbitMQ moves the message to the dead-letter queue instead of redelivering it forever
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Comma-separated; deployed frontend origin is set via APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=http://localhost:4200

# The same Auth0 API as java-api (see SecurityConfig): one access token is valid for both services
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://todo-app-todos.eu.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://todo-api
